name: merchant-card-style
on:
  push:
    branches: [main]
    paths: ['.github/workflows/merchant-card-style.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact category-pill styling to provider cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('artifacts/pibooking/src/components/MerchantCard.tsx')
          s=p.read_text()
          old='bg-white p-5 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between text-zinc-900 space-y-4'
          new='bg-zinc-50 hover:bg-orange-50/60 p-5 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between text-zinc-900 space-y-4'
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one outer-card match; found {count}')
          p.write_text(s.replace(old,new))
          print('Applied exact provider-card background/hover classes.')
          PY
          git diff --check
          grep -n 'bg-zinc-50 hover:bg-orange-50/60 p-5' artifacts/pibooking/src/components/MerchantCard.tsx
          git config user.name 'W3C CT'
          git config user.email 'web3currency.info@gmail.com'
          git add artifacts/pibooking/src/components/MerchantCard.tsx
          git diff --cached --check
          git commit -m 'style: match provider cards to category pills'
          git push origin main

          git rm .github/workflows/merchant-card-style.yml
          git commit -m 'chore: remove temporary provider-card styling workflow [skip ci]'
          git push origin main
