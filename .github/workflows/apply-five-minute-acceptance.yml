name: apply-five-minute-acceptance
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify five-minute acceptance implementation
        run: |
          grep -R "5 \* 60 \* 1000" artifacts/api-server/src artifacts/pibooking/src --include='*.ts' --include='*.tsx'
          ! grep -R "24 \* 60 \* 60 \* 1000" artifacts/api-server/src artifacts/pibooking/src --include='*.ts' --include='*.tsx'
          ! grep -R "within 24 hours\|24-hour acceptance" artifacts/api-server/src artifacts/pibooking/src --include='*.ts' --include='*.tsx'
          git diff --check
