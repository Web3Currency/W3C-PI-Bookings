name: refactor-provider-console
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-provider-console.yml'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor provider console
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('artifacts/pibooking/src/features/provider/ProviderDashboardView.tsx')
          text = path.read_text()

          preview_start = text.index("  if (activeTab === 'preview_profile')")
          return_start = text.index("  return (", preview_start)
          preview_block = text[preview_start:return_start]
          preview_match = re.search(r"const previewMerchant: Provider = (.*?); return", preview_block, re.S)
          if not preview_match:
              raise SystemExit('Could not extract preview merchant definition')
          preview_definition = "  const previewMerchant: Provider = " + preview_match.group(1) + ";\n"

          edit_start = text.index("    {activeTab === 'edit_profile' && (")
          edit_end_marker = "</form>)}"
          edit_end = text.index(edit_end_marker, edit_start) + len(edit_end_marker)
          edit_block = text[edit_start:edit_end]

          prefix = text[:preview_start]
          prefix = prefix.replace(
              "useState<'bookings' | 'edit_profile' | 'preview_profile'>('bookings')",
              "useState<'bookings' | 'earnings' | 'release' | 'edit_profile' | 'preview_profile'>('bookings')"
          )
          prefix = prefix.replace(
              "const [acceptingBookingId, setAcceptingBookingId] = useState<string | null>(null); const [actionMessage, setActionMessage] = useState<string>(''); const [rejectModalBooking, setRejectModalBooking] = useState<Booking | null>(null); const [rejectionReasonInput, setRejectionReasonInput] = useState<string>(''); const [isRejecting, setIsRejecting] = useState<boolean>(false); const [detailsBooking, setDetailsBooking] = useState<Booking | null>(null);",
              "const [acceptingBookingId, setAcceptingBookingId] = useState<string | null>(null); const [actionMessage, setActionMessage] = useState<string>(''); const [rejectModalBooking, setRejectModalBooking] = useState<Booking | null>(null); const [rejectionReasonInput, setRejectionReasonInput] = useState<string>(''); const [isRejecting, setIsRejecting] = useState<boolean>(false); const [detailsBooking, setDetailsBooking] = useState<Booking | null>(null); const [bookingSearch, setBookingSearch] = useState<string>(''); const [bookingFilter, setBookingFilter] = useState<'all' | 'pending' | 'in_progress' | 'completed' | 'cancelled'>('all');"
          )

          insertion = """
  const filteredBookings = useMemo(() => {
    const query = bookingSearch.trim().toLowerCase();
    return providerBookings.filter((booking) => {
      const statusMatch = bookingFilter === 'all'
        || (bookingFilter === 'pending' && booking.status === 'Confirmed' && booking.escrow_status === 'paid_escrowed')
        || (bookingFilter === 'in_progress' && booking.status === 'In Progress')
        || (bookingFilter === 'completed' && (booking.status === 'Completed' || booking.escrow_status === 'released'))
        || (bookingFilter === 'cancelled' && booking.status === 'Cancelled');
      if (!statusMatch) return false;
      if (!query) return true;
      return [booking.id, booking.serviceName, booking.clientName, booking.clientPiUsername, booking.clientPhone, booking.clientEmail]
        .filter(Boolean).some((value) => String(value).toLowerCase().includes(query));
    });
  }, [providerBookings, bookingSearch, bookingFilter]);

  const bookingStatusLabel = (booking: Booking) => {
    if (booking.status === 'Cancelled') return 'Cancelled';
    if (booking.status === 'In Progress') return 'In Progress';
    if (booking.status === 'Completed' || booking.escrow_status === 'released') return 'Completed';
    if (booking.status === 'Confirmed' && booking.escrow_status === 'paid_escrowed') return 'Pending';
    return booking.status || 'Pending';
  };
"""
          prefix = prefix.replace("  const earnings = useMemo(() =>", insertion + "\n  const earnings = useMemo(() =>")

          prefix = re.sub(r"import \{[^\n]+\} from 'lucide-react';", "import { ArrowLeft, Check, X, Search, SlidersHorizontal, Eye, Save, Plus, Trash2, Camera, Globe, Mail, Phone, MapPin, Image as ImageIcon } from 'lucide-react';", prefix, count=1)

          dashboard_return = r'''  return (<div className="space-y-6 pb-24 animate-in fade-in duration-200">
    <div className="flex items-center justify-between gap-3 border-b border-zinc-200 pb-4">
      <button type="button" onClick={onBack} className="flex items-center gap-1.5 text-sm font-semibold text-zinc-700 hover:text-zinc-950 transition"><ArrowLeft className="w-4 h-4" /><span>Back to Marketplace</span></button>
      <button type="button" onClick={() => setActiveTab('edit_profile')} className="text-sm font-bold text-zinc-800 hover:text-amber-700 transition">Edit Profile</button>
    </div>
    {actionMessage && <div className="text-xs font-semibold text-emerald-800 bg-emerald-50 border-b border-emerald-200 py-2">{actionMessage}</div>}
    {activeTab === 'edit_profile' && <div className="space-y-4 animate-in fade-in duration-150">
      <div className="flex items-center justify-between gap-3 border-b border-zinc-200 pb-3"><div><h2 className="text-lg font-black text-zinc-950">Edit Profile</h2><p className="text-xs text-zinc-500">Update the provider profile clients see.</p></div><button type="button" onClick={() => setActiveTab('preview_profile')} className="inline-flex items-center gap-1.5 text-xs font-bold text-amber-700 hover:text-amber-800"><Eye className="w-3.5 h-3.5" />Preview</button></div>
      __EDIT_BLOCK__
    </div>}
    {activeTab === 'preview_profile' && <div className="space-y-4 animate-in fade-in duration-150">
      <div className="flex items-center justify-between border-b border-zinc-200 pb-3"><h2 className="text-lg font-black text-zinc-950">Profile Preview</h2><button type="button" onClick={() => setActiveTab('edit_profile')} className="text-xs font-bold text-amber-700">Back to Edit</button></div>
      {preview_definition}
      <PublicProfileView merchant={previewMerchant} services={providerServices} onBack={() => setActiveTab('edit_profile')} />
    </div>}
    {activeTab !== 'edit_profile' && activeTab !== 'preview_profile' && <>
      <div className="flex items-center border-b border-zinc-200">
        {(['bookings','earnings','release'] as const).map((tab) => <button key={tab} type="button" onClick={() => setActiveTab(tab)} className={`px-5 py-3 text-sm font-bold border-b-2 transition ${activeTab === tab ? 'border-amber-600 text-zinc-950' : 'border-transparent text-zinc-500 hover:text-zinc-900'}`}>{tab === 'bookings' ? 'Bookings' : tab === 'earnings' ? 'Earnings' : 'Release'}</button>)}
      </div>
      {activeTab === 'bookings' && <section className="space-y-4">
        <div className="flex items-center gap-2"><div className="relative flex-1"><Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400" /><input value={bookingSearch} onChange={(e) => setBookingSearch(e.target.value)} placeholder="Search bookings..." className="w-full pl-9 pr-3 py-2.5 text-sm bg-zinc-50 border border-zinc-200 rounded-xl focus:outline-none focus:border-amber-500" /></div><div className="relative"><SlidersHorizontal className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500 pointer-events-none" /><select value={bookingFilter} onChange={(e) => setBookingFilter(e.target.value as typeof bookingFilter)} className="pl-9 pr-3 py-2.5 text-sm bg-zinc-50 border border-zinc-200 rounded-xl appearance-none focus:outline-none focus:border-amber-500"><option value="all">All</option><option value="pending">Pending</option><option value="in_progress">In Progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div></div>
        <div className="border-t border-zinc-200">{filteredBookings.length === 0 ? <div className="py-10 text-center text-sm text-zinc-500">No bookings match your search or filter.</div> : filteredBookings.map((booking) => { const label = bookingStatusLabel(booking); const pending = label === 'Pending'; return <div key={booking.id} className="py-4 border-b border-zinc-200"><div className="flex items-start justify-between gap-4"><div className="min-w-0 flex-1"><div className="flex items-center gap-2 flex-wrap"><h3 className="font-bold text-sm text-zinc-950 truncate">{booking.serviceName}</h3><span className="text-[10px] font-bold uppercase tracking-wide text-zinc-500">{label}</span></div><p className="text-xs text-zinc-600 mt-1">{booking.clientName || booking.clientPiUsername || 'Client'} · {booking.date || 'Date not set'} · {booking.timeSlot || 'Time not set'} · {booking.pricePi || 0} π</p></div><button type="button" onClick={() => setDetailsBooking(booking)} className="shrink-0 text-xs font-bold text-amber-700 hover:text-amber-800">View Details</button></div>{pending && <div className="flex justify-end gap-2 mt-3"><button type="button" disabled={acceptingBookingId === booking.id} onClick={async () => { setAcceptingBookingId(booking.id); try { await onAcceptBooking(booking.id); setActionMessage('Booking accepted.'); } catch (err: any) { setActionMessage(err?.message || 'Could not accept booking.'); } finally { setAcceptingBookingId(null); } }} className="px-3 py-2 rounded-xl bg-amber-600 text-white text-xs font-bold disabled:opacity-50">{acceptingBookingId === booking.id ? 'Accepting...' : 'Accept'}</button><button type="button" onClick={() => { setRejectModalBooking(booking); setRejectionReasonInput(''); }} className="px-3 py-2 rounded-xl border border-zinc-300 text-zinc-800 text-xs font-bold hover:bg-zinc-50">Reject</button></div>}</div>; })}</div>
      </section>}
      {activeTab === 'earnings' && <section className="space-y-4 text-sm"><div className="grid grid-cols-2 sm:grid-cols-3 gap-4 py-2"><div><span className="block text-[10px] font-bold uppercase text-zinc-400">Total Earnings</span><span className="text-xl font-black text-zinc-950">{earnings.totalEarnings.toFixed(2)} π</span></div><div><span className="block text-[10px] font-bold uppercase text-zinc-400">Pending Payouts</span><span className="text-xl font-black text-zinc-950">{earnings.pendingPayouts.toFixed(2)} π</span></div><div><span className="block text-[10px] font-bold uppercase text-zinc-400">Released</span><span className="text-xl font-black text-zinc-950">{earnings.releasedPayouts.toFixed(2)} π</span></div></div></section>}
      {activeTab === 'release' && <section className="space-y-4"><div className="border-t border-zinc-200">{sections.awaitingClient.length === 0 ? <div className="py-10 text-center text-sm text-zinc-500">No bookings are currently awaiting release.</div> : sections.awaitingClient.map((booking) => <div key={booking.id} className="py-4 border-b border-zinc-200 flex items-center justify-between gap-4"><div><h3 className="text-sm font-bold text-zinc-950">{booking.serviceName}</h3><p className="text-xs text-zinc-500">{booking.clientName || booking.clientPiUsername || 'Client'} · {booking.provider_payout_pi || 0} π pending</p></div><button type="button" onClick={() => setDetailsBooking(booking)} className="text-xs font-bold text-amber-700">View Details</button></div>)}</div></section>}
    </>}
    {rejectModalBooking && <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50"><div className="w-full max-w-md bg-white rounded-2xl p-5 shadow-xl"><div className="flex items-center justify-between mb-4"><h3 className="font-black text-zinc-950">Reject Booking</h3><button type="button" onClick={() => setRejectModalBooking(null)} className="p-1.5 text-zinc-500"><X className="w-4 h-4" /></button></div><p className="text-xs text-zinc-600 mb-3">Provide a reason for rejecting this booking.</p><textarea value={rejectionReasonInput} onChange={(e) => setRejectionReasonInput(e.target.value)} rows={4} placeholder="Reason for rejection..." className="w-full p-3 text-sm bg-zinc-50 border border-zinc-200 rounded-xl focus:outline-none focus:border-amber-500" /><div className="flex justify-end gap-2 mt-4"><button type="button" onClick={() => setRejectModalBooking(null)} className="px-3 py-2 rounded-xl text-xs font-bold text-zinc-700">Cancel</button><button type="button" disabled={isRejecting || !rejectionReasonInput.trim()} onClick={async () => { if (!rejectModalBooking) return; setIsRejecting(true); try { await onRejectBooking(rejectModalBooking.id, rejectionReasonInput.trim()); setRejectModalBooking(null); setRejectionReasonInput(''); setActionMessage('Booking rejected and cancelled.'); } catch (err: any) { setActionMessage(err?.message || 'Could not reject booking.'); } finally { setIsRejecting(false); } }} className="px-3 py-2 rounded-xl bg-red-600 text-white text-xs font-bold disabled:opacity-50">{isRejecting ? 'Rejecting...' : 'Reject Booking'}</button></div></div></div>}
    {detailsBooking && <ProviderBookingDetails booking={detailsBooking} onClose={() => setDetailsBooking(null)} />}
  </div>);
'''
          dashboard_return = dashboard_return.replace('{preview_definition}', preview_definition).replace('__EDIT_BLOCK__', edit_block)
          new_text = prefix + preview_definition + dashboard_return
          path.write_text(new_text)
          print(f'Refactored {path}: {len(new_text)} bytes')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/pibooking/src/features/provider/ProviderDashboardView.tsx
          git commit -m "refactor: streamline provider console"
          git push origin main
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/refactor-provider-console.yml
          git commit -m "chore: remove one-time refactor workflow [skip ci]"
          git push origin main
