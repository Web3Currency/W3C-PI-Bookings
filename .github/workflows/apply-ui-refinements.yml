name: apply-ui-refinements
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-ui-refinements.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped refinements
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p=Path(path); s=p.read_text(); n=fn(s); p.write_text(n)
              if n==s: raise SystemExit(f'No change made to {path}')

          # Hide the header-level Become a Provider CTA; keep the side-menu action.
          edit('artifacts/pibooking/src/components/Navbar.tsx', lambda s: s.replace("{!hasProvider && onOpenBecomeProvider && <button onClick={onOpenBecomeProvider} id=\"btn-nav-become-provider\" title=\"Become a Provider\" className=\"px-3.5 py-1.5 rounded-full bg-orange-600 hover:bg-orange-500 text-white text-xs font-bold transition shadow-xs cursor-pointer\">Become a Provider</button>}", ""))

          # Remove booking attachments from client flow and persisted payloads.
          edit('artifacts/pibooking/src/components/SelectDetailsStep.tsx', lambda s: re.sub(r"interface AttachedFile \{.*?\}\n", "", s, flags=re.S).replace("import { ArrowLeft, User, Paperclip, Upload, X, ArrowRight, ShieldCheck, AtSign, Send, Mail } from 'lucide-react';", "import { ArrowLeft, User, ArrowRight, ShieldCheck, AtSign, Send, Mail } from 'lucide-react';").replace("; attachments?: AttachedFile[]", "").replace(", attachments: AttachedFile[]", "").replace("  const [attachments, setAttachments] = useState<AttachedFile[]>(initialDetails.attachments || []);\n  const [isDragging, setIsDragging] = useState(false);\n", "").replace("  const handleFileUpload = (files: FileList | null) => {", "  /* attachments intentionally removed from the booking step */\n  const handleFileUpload = (files: FileList | null) => {").replace("  const handleFileUpload = (files: FileList | null) => {", "  const handleFileUpload = (_files: FileList | null) => {").replace("  const handleRemoveAttachment = (id: string) => setAttachments((prev) => prev.filter((a) => a.id !== id));\n", "").replace("onProceedToSchedule({ clientName: clientName.trim(), clientPiUsername: finalHandle, clientPhone: clientPhone.trim(), clientEmail: clientEmail.trim(), notes, attachments });", "onProceedToSchedule({ clientName: clientName.trim(), clientPiUsername: finalHandle, clientPhone: clientPhone.trim(), clientEmail: clientEmail.trim(), notes });").replace("2. Project Brief & Asset Upload", "2. Project Brief").replace("<div><label className=\"block text-[11px] font-bold text-zinc-700 mb-1.5\">Attach Wireframes, Specs, or Assets (Optional)</label>", "<div className=\"hidden\"><label>").replace("<div onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }} onDragLeave={() => setIsDragging(false)} onDrop={(e) => { e.preventDefault(); setIsDragging(false); handleFileUpload(e.dataTransfer.files); }} className={`rounded-2xl p-5 text-center cursor-pointer transition shadow-xs ${isDragging ? 'bg-amber-100/80 scale-[0.99]' : 'bg-zinc-50 hover:bg-amber-50/70'}`}>", "<div>").replace("</div>{attachments.length > 0 && <div className=\"mt-3 space-y-2\"><span className=\"text-[10px] font-bold text-zinc-500 uppercase tracking-wider block\">Attached Assets ({attachments.length})</span>{attachments.map((att) => <div key={att.id} className=\"p-3 rounded-2xl bg-zinc-50 flex items-center justify-between text-xs shadow-2xs\"><div className=\"flex items-center gap-2.5 min-w-0\"><Paperclip className=\"w-4 h-4 text-amber-600 shrink-0\" /><div className=\"min-w-0\"><p className=\"font-bold text-zinc-900 truncate text-xs\">{att.name}</p><p className=\"text-[10px] text-zinc-500\">{att.size}</p></div></div><button type=\"button\" onClick={() => handleRemoveAttachment(att.id)} className=\"p-1.5 rounded-xl text-zinc-400 hover:text-red-500 hover:bg-zinc-200/60 transition cursor-pointer\" title=\"Remove attachment\"><X className=\"w-4 h-4\" /></button></div>)}</div>}</div>", "</div>").replace("  const handleFileUpload = (_files: FileList | null) => {\n", ""))

          # Remove attachment UI/data from the review and payment stages.
          edit('artifacts/pibooking/src/components/BookingSummaryStep.tsx', lambda s: re.sub(r"\ninterface AttachedFile \{.*?\}\n", "\n", s, flags=re.S).replace("  Paperclip,\n", "").replace(";\n", ";\n", 1).replace("; attachments?: AttachedFile[]", "").replace("\n            {/* Attached Files */}.*?\n            )}", "", flags=re.S))
          edit('artifacts/pibooking/src/components/PiPaymentModal.tsx', lambda s: s.replace("; attachments?: { id: string; name: string; size: string; type: string; dataUrl?: string }[]", "").replace(", attachments: clientDetails.attachments", ""))
          edit('artifacts/pibooking/src/App.tsx', lambda s: s.replace("; attachments?:{id:string;name:string;size:string;type:string;dataUrl?:string}[]", "").replace(",attachments:[]", ""))
          edit('artifacts/pibooking/src/services/bookingService.ts', lambda s: s.replace("        attachments: Array.isArray(row.attachments) ? row.attachments : [],\n", "").replace(", attachments: fullBooking.attachments || []", ""))
          edit('artifacts/pibooking/src/types.ts', lambda s: re.sub(r"\nexport interface BookingAttachment \{.*?\}\n", "\n", s, flags=re.S).replace("  attachments?: BookingAttachment[];\n", ""))

          # Service schema: description only; remove full_description everywhere.
          edit('artifacts/pibooking/src/services/providerServiceService.ts', lambda s: s.replace("    fullDescription: row.full_description || '',\n", "").replace("  fullDescription: string;\n", "").replace("fullDescription: service.fullDescription || '', ", "").replace("fullDescription: '', ", "").replace("fullDescription: draft.fullDescription.trim(), ", ""))
          edit('artifacts/api-server/src/routes/pi-services.ts', lambda s: s.replace('  const fullDescription = String(body.fullDescription || "").trim();\n', '').replace('fullDescription, ', '').replace('full_description: service.fullDescription, ', '').replace('full_description: service.fullDescription,', ''))
          edit('artifacts/pibooking/src/services/serviceService.ts', lambda s: s.replace("        fullDescription: row.full_description || row.short_description || '',\n", "").replace("          full_description: newService.fullDescription || '',\n", "").replace("        if (updates.fullDescription !== undefined) payload.full_description = updates.fullDescription;\n", ""))
          edit('artifacts/pibooking/src/types.ts', lambda s: s.replace("  fullDescription?: string;\n", ""))

          # Provider service editor: Description only and real cover-image upload.
          p=Path('artifacts/pibooking/src/features/provider/ProviderServicesView.tsx'); s=p.read_text()
          s=s.replace("import { ArrowLeft, Check, Edit3, Eye, Plus, Save, X } from 'lucide-react';", "import { ArrowLeft, Check, Edit3, Eye, Plus, Save, Upload, X } from 'lucide-react';")
          s=s.replace("import { providerServiceService, ProviderServiceInput } from '../../services/providerServiceService';", "import { providerServiceService, ProviderServiceInput } from '../../services/providerServiceService';\nimport { providerMediaService } from '../../services/providerMediaService';\nimport { piAuthService } from '../../services/piAuthService';")
          s=s.replace("  title: '', shortDescription: '', fullDescription: '', coverImage: '',", "  title: '', shortDescription: '', coverImage: '',")
          s=s.replace("setDraft({ title: service.name, shortDescription: service.description, fullDescription: service.fullDescription || '', coverImage:", "setDraft({ title: service.name, shortDescription: service.description, coverImage:")
          s=s.replace("const [saving, setSaving] = useState(false);", "const [saving, setSaving] = useState(false);\n  const [uploadingCover, setUploadingCover] = useState(false);")
          s=s.replace("shortDescription: draft.shortDescription.trim(), fullDescription: draft.fullDescription.trim(), coverImage:", "shortDescription: draft.shortDescription.trim(), coverImage:")
          s=s.replace("<div className=\"grid grid-cols-1 lg:grid-cols-2 gap-5\">", "<div className=\"grid grid-cols-1 lg:grid-cols-2 gap-5\">\n            <div className=\"lg:col-span-2\"><label className={labelClass}>Cover Image</label><div className=\"flex items-center gap-3\"><label className=\"inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-orange-50 text-orange-700 text-xs font-black cursor-pointer hover:bg-orange-100\"><Upload className=\"w-4 h-4\" />{uploadingCover ? 'Uploading…' : 'Upload Cover Image'}<input type=\"file\" accept=\"image/png,image/jpeg,image/webp\" className=\"hidden\" disabled={uploadingCover} onChange={async (e) => { const file=e.target.files?.[0]; if(!file)return; const user=piAuthService.getStoredUser(); if(!user?.accessToken||!user.uid){setError('Please sign in with Pi Network first.');return;} setUploadingCover(true); setError(''); try { const result=await providerMediaService.uploadServiceCover(file,{providerIdentifier:user.uid,piAccessToken:user.accessToken}); update('coverImage',result.publicUrl); setNotice('Cover image uploaded.'); } catch(err:any){ setError(err?.message || 'Cover image upload failed.'); } finally { setUploadingCover(false); e.currentTarget.value=''; } }} /></label>{draft.coverImage && <img src={draft.coverImage} alt=\"Cover preview\" className=\"w-20 h-14 rounded-xl object-cover border border-zinc-200\" />}</div></div>")
          s=s.replace("<div className=\"lg:col-span-2\"><label className={labelClass}>Short Description</label>", "<div className=\"lg:col-span-2\"><label className={labelClass}>Description</label>")
          s=s.replace("            <div className=\"lg:col-span-2\"><label className={labelClass}>Full Description</label><textarea className={`${inputClass} min-h-32 resize-y`} value={draft.fullDescription} onChange={(e) => update('fullDescription', e.target.value)} placeholder=\"Give clients the complete service description, scope and expectations.\" /></div>\n            <div className=\"lg:col-span-2\"><label className={labelClass}>Cover Image URL</label><input className={inputClass} value={draft.coverImage} onChange={(e) => update('coverImage', e.target.value)} placeholder=\"https://...\" /></div>\n", "")
          s=s.replace("preview.fullDescription || preview.description", "preview.description")
          p.write_text(s)

          # Add provider profile action to service detail.
          edit('artifacts/pibooking/src/components/ServiceDetail.tsx', lambda s: s.replace("  onProceedToBooking: () => void;", "  onProceedToBooking: () => void;\n  onOpenProviderProfile?: (provider: Provider) => void;").replace("export const ServiceDetail: React.FC<ServiceDetailProps> = ({ service, business, onBack, onProceedToBooking }) => {", "export const ServiceDetail: React.FC<ServiceDetailProps> = ({ service, business, onBack, onProceedToBooking, onOpenProviderProfile }) => {").replace("<div className=\"p-5 rounded-3xl bg-white shadow-sm flex items-center gap-4\">", "<div className=\"p-5 rounded-3xl bg-white shadow-sm flex items-center gap-4\">").replace("        </div>\n      </div>\n\n      <div className=\"fixed bottom-0", "          {resolvedProvider && onOpenProviderProfile && <button type=\"button\" onClick={() => onOpenProviderProfile(resolvedProvider)} className=\"shrink-0 text-[11px] font-bold text-orange-700 hover:text-orange-800\">View Profile</button>}\n        </div>\n      </div>\n\n      <div className=\"fixed bottom-0", 1))
          edit('artifacts/pibooking/src/App.tsx', lambda s: s.replace("<ServiceDetail service={selectedService} business={businessWithServices} onBack", "<ServiceDetail service={selectedService} business={businessWithServices} onOpenProviderProfile={(provider)=>{setSelectedProfile(provider);setCurrentFlow('about');}} onBack"))

          # Extend the existing secure media flow for service covers.
          edit('artifacts/pibooking/src/services/providerMediaService.ts', lambda s: s.replace("type: 'profile' | 'portfolio'", "type: 'profile' | 'portfolio' | 'service'").replace("  async uploadPortfolioImage(\n", "  async uploadServiceCover(\n    file: File,\n    options: UploadMediaOptions\n  ): Promise<UploadMediaResult> {\n    return this.uploadMedia(file, 'service', options);\n  },\n\n  async uploadPortfolioImage(\n").replace("const expectedStoragePath = `providers/${cleanProvider}/${type}/${timestamp}_${sanitizedFilename}`;", "const expectedStoragePath = `providers/${cleanProvider}/${type}/${timestamp}_${sanitizedFilename}`;"))

          # Remove the one-time workflow after applying this batch; the implementation commit is the next commit on main.
          Path('.github/workflows/refactor-provider-console.yml').unlink(missing_ok=True)
          Path('.github/workflows/apply-ui-refinements.yml').unlink(missing_ok=True)
          PY
          # Update the Supabase Edge Function separately through its deployment pipeline in the next step.
          git config user.name "W3C CT"
          git config user.email "web3currency.info@gmail.com"
          git add artifacts .github/workflows
          git commit -m "refine: clean provider, service and booking UI"
          git push origin main
